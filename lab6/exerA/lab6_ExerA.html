<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header banner -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- Player name card -->
        <section class="card">
            <div class="player-row">
                <label for="playerName">Your name:</label>
                <input type="text" id="playerName">
                <button onclick="startGame()">Start Game</button>
                <span id="welcomeMsg"></span>
            </div>
        </section>

        <!-- Game choices and VS display card -->
        <section class="card">
            <div class="choice-buttons">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="battle-arena">
                <div class="player-box">
                    <p class="fighter-label">You</p>
                    <img id="playerImg" src="rock.png" alt="You">
                </div>
                <div class="vs-text">VS</div>
                <div class="player-box">
                    <p class="fighter-label">Computer</p>
                    <img id="computerImg" src="rock.png" alt="Computer">
                </div>
            </div>
        </section>

        <!-- Result and scoreboard card -->
        <section class="card">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <span id="wins">0</span></span>
                <span>Losses: <span id="losses">0</span></span>
                <span>Draws: <span id="draws">0</span></span>
            </div>
        </section>

        <!-- History table and summary/reset card -->
        <section class="card">
            <h2>History</h2>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Rows added dynamically by JavaScript -->
                </tbody>
            </table>

            <div class="bottom-controls">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summary"></p>
        </section>

        <!-- Footer -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
