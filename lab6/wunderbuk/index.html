<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSF3133 - Interactive Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Header quiz -->
        <header>
            <h1>Web Development Quiz</h1>
            <p>Test your knowledge of HTML, CSS, and JavaScript!</p>
        </header>

        <main>
            <!-- Section to display -->
            <section id="quiz-section">
                <div class="quiz-header-bar">
                    <span id="question-counter">Question 1 of 5</span>
                    <div id="timer-display">Time Left: <span id="time-left">15</span>s</div>
                </div>

                <h2 id="question-text">Question goes here...</h2>
                
                <div id="options-container" class="options-grid">
                </div>
            </section>

            <!-- Section to show real-time feedback -->
            <section id="feedback-section" class="hidden">
                <p id="feedback-text"></p>
            </section>

            <!-- Controls  -->
            <div class="controls">
                <button id="submit-btn" class="btn primary-btn" disabled>Submit Answer</button>
                <button id="next-btn" class="btn secondary-btn hidden">Next Question</button>
                <button id="restart-btn" class="btn primary-btn hidden">Restart Quiz</button>
            </div>
        </main>

        <!-- Footer displaying user's score -->
        <footer>
            <p id="score-display">Score: <span id="score">0</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
